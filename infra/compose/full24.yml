      NODE_INDEX: 3
      PORT: 8001
      MTLS_PORT: 8443
      PEER_NODES: http://node-r2:8001,http://node-r4:8001
    volumes: ['node_r3_vault:/vault', '../../infra/tls:/etc/saral/tls:ro', '../../infra/secrets/internal_token.secret:/run/secrets/saral_internal_token:ro', '../../infra/config/genesis_participants.json:/run/secrets/saral_genesis_participants.json:ro', '../../infra/config/auth_public_key.pem:/run/secrets/auth_ed25519_pub.pem:ro']
