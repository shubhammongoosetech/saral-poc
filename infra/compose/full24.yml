services:
  # ─── PostgreSQL 16 (SARAL Production Persistence) ─────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: saral-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: saral
      POSTGRES_PASSWORD: saral_secret
      POSTGRES_DB: saral
    volumes:
      - saral_postgres_data:/var/lib/postgresql/data
      - ../../infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - '127.0.0.1:5432:5432'
    networks:
      - saral-mesh
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U saral -d saral']
      interval: 4s
      timeout: 3s
      retries: 5

  # ─── Auth Server ─────────────────────────────────────────────────────────
  auth-server:
    build:
      context: ../../apps/auth-server
      dockerfile: Dockerfile
    image: saral-auth-server:latest
    container_name: saral-prod-auth-server
    restart: unless-stopped
    environment:
      PORT: 3001
      NODE_ENV: development
      ENABLE_DEV_AUTH: "${ENABLE_DEV_AUTH:-false}"
      COORDINATOR_URL: http://coordinator-foundation:9001
      COORDINATOR_PUBLIC_URL: http://coordinator-public:9002
      COORDINATOR_PRIVATE_URL: http://coordinator-private:9003
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      MFA_ENCRYPTION_KEY: "${MFA_ENCRYPTION_KEY:-}"
      KEY_DIR: /run/secrets
      DATABASE_URL: "postgresql://saral:saral_secret@postgres:5432/saral"
    volumes:
      - '../../infra/config/auth_ed25519_private_key.pem:/run/secrets/auth_ed25519_private_key.pem:ro'
      - '../../infra/config/auth_ed25519_public_key.pem:/run/secrets/auth_ed25519_public_key.pem:ro'
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '127.0.0.1:3001:3001'
    networks:
      - saral-mesh
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3001/health']
      interval: 4s
      timeout: 3s
      retries: 5

  # ─── Verifiers (Foundation, Public, Private) ───────────────────────────
  verifier-foundation:
    build:
      context: ../../services/verifier
      dockerfile: Dockerfile
    image: saral-verifier:latest
    container_name: saral-prod-verifier-foundation
    restart: unless-stopped
    environment:
      PORT: 9101
      DOMAIN: FOUNDATION
      AUTH_SERVER_URL: http://auth-server:3001
    volumes: ['../../infra/config/auth_public_key.pem:/keys/auth_public_key.pem:ro']
    depends_on:
      auth-server:
        condition: service_healthy
    networks:
      - saral-mesh
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:9101/health']
      interval: 4s
      timeout: 3s
      retries: 5

  verifier-public:
    image: saral-verifier:latest
    container_name: saral-prod-verifier-public
    restart: unless-stopped
    environment:
      PORT: 9102
      DOMAIN: PUBLIC
      AUTH_SERVER_URL: http://auth-server:3001
    volumes: ['../../infra/config/auth_public_key.pem:/keys/auth_public_key.pem:ro']
    depends_on:
      auth-server:
        condition: service_healthy
    networks:
      - saral-mesh
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:9102/health']
      interval: 4s
      timeout: 3s
      retries: 5

  verifier-private:
    image: saral-verifier:latest
    container_name: saral-prod-verifier-private
    restart: unless-stopped
    environment:
      PORT: 9103
      DOMAIN: PRIVATE
      AUTH_SERVER_URL: http://auth-server:3001
    volumes: ['../../infra/config/auth_public_key.pem:/keys/auth_public_key.pem:ro']
    depends_on:
