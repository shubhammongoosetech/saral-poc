  # ─── Web Frontend ──────────────────────────────────────────────────────
  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
    image: saral-web:latest
    container_name: saral-prod-web
    restart: unless-stopped
    ports:
      - '127.0.0.1:3000:80'
    depends_on:
      auth-server:
        condition: service_healthy
      coordinator-foundation:
        condition: service_healthy
    networks:
      - saral-mesh
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:80']
      interval: 4s
      timeout: 3s
      retries: 5

networks:
  saral-mesh:
    driver: bridge

volumes:
  saral_postgres_data:
