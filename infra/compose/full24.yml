services:
  # ─── PostgreSQL 16 ───────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: saral-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: saral
      POSTGRES_PASSWORD: saral_secret
      POSTGRES_DB: saral
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - saral_postgres_data:/var/lib/postgresql/data
      - ../postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - saral-mesh
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U saral -d saral']
      interval: 3s
      timeout: 3s
      retries: 5

  # ─── Auth Server ─────────────────────────────────────────────────────────
  auth-server:
    build:
      context: ../../apps/auth-server
      dockerfile: Dockerfile
    image: saral-auth-server:latest
    container_name: saral-prod-auth-server
    restart: unless-stopped
    environment:
      PORT: 3001
      NODE_ENV: development
      ENABLE_DEV_AUTH: "${ENABLE_DEV_AUTH:-false}"
      SARAL_NODE_URL: http://node-f1:8001
      SARAL_NODE_FOUNDATION_URL: http://node-f1:8001
      SARAL_NODE_PUBLIC_URL: http://node-p1:8001
      SARAL_NODE_PRIVATE_URL: http://node-r1:8001
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      MFA_ENCRYPTION_KEY: "${MFA_ENCRYPTION_KEY:-}"
      KEY_DIR: /run/secrets
      DATABASE_URL: "postgresql://saral:saral_secret@postgres:5432/saral"
    volumes:
      - '../../infra/config/auth_ed25519_private_key.pem:/run/secrets/auth_ed25519_private_key.pem:ro'
      - '../../infra/config/auth_ed25519_public_key.pem:/run/secrets/auth_ed25519_public_key.pem:ro'
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '127.0.0.1:3001:3001'
    networks:
      - saral-mesh
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3001/health']
      interval: 4s
      timeout: 3s
      retries: 5

  # ─── Foundation SARAL Nodes (1 - 5) ──────────────────────────────────
  node-f1:
    build:
      context: ../../services/saral-node
      dockerfile: Dockerfile
    image: saral-node:latest
    container_name: saral-prod-node-f1
    restart: unless-stopped
    environment:
      NODE_ID: saral-foundation-1
      DOMAIN: FOUNDATION
      NODE_INDEX: 1
      PORT: 8001
      MTLS_PORT: 8443
      PEER_NODES: http://node-f2:8001,http://node-p1:8001,http://node-r1:8001
    volumes: ['node_f1_vault:/vault', '../../infra/tls:/etc/saral/tls:ro', '../../infra/secrets/internal_token.secret:/run/secrets/saral_internal_token:ro', '../../infra/config/genesis_participants.json:/run/secrets/saral_genesis_participants.json:ro', '../../infra/config/auth_public_key.pem:/run/secrets/auth_ed25519_pub.pem:ro']
    ports:
      - '127.0.0.1:8001:8001'
      - '127.0.0.1:8443:8443'
    networks:
      - saral-mesh
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:8001/node/status']
      interval: 4s
      timeout: 3s
      retries: 5

  node-f2:
