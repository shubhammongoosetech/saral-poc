      SARAL_INTERNAL_TOKEN: "saral-mesh-secure-internal-token-v3"
      SARAL_ENCRYPTION_KEY: "saral-mesh-aes-encryption-key-v3"
      COORDINATOR_URL: http://coordinator-private:9003
