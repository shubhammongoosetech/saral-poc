      interval: 4s
      timeout: 3s
      retries: 5

  # ─── Coordinators (Foundation, Public, Private) ────────────────────────
  coordinator-foundation:
    build:
      context: ../../services/coordinator
      dockerfile: Dockerfile
    image: saral-coordinator:v3
    container_name: saral-coord-foundation
    restart: unless-stopped
    environment:
      PORT: 9001
      SARAL_INTERNAL_TOKEN: "saral-mesh-secure-internal-token-v3"
      SARAL_ENCRYPTION_KEY: "saral-mesh-aes-encryption-key-v3"
      DOMAIN: FOUNDATION
      VERIFIER_URL: http://verifier-foundation:9101
      PEER_COORDINATORS: http://coordinator-public:9002,http://coordinator-private:9003
      NODE_ADDRS: http://node-f1:8001,http://node-f2:8001,http://node-f3:8001,http://node-f4:8001,http://node-f5:8001
    ports:
      - '9001:9001'
    depends_on:
      verifier-foundation:
        condition: service_healthy
      node-f1:
        condition: service_healthy
    networks:
      - saral-mesh
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:9001/health']
      interval: 4s
      timeout: 3s
      retries: 5

  coordinator-public:
    image: saral-coordinator:v3
    container_name: saral-coord-public
    restart: unless-stopped
    environment:
      PORT: 9002
      SARAL_INTERNAL_TOKEN: "saral-mesh-secure-internal-token-v3"
      SARAL_ENCRYPTION_KEY: "saral-mesh-aes-encryption-key-v3"
      DOMAIN: PUBLIC
      VERIFIER_URL: http://verifier-public:9102
      PEER_COORDINATORS: http://coordinator-foundation:9001,http://coordinator-private:9003
      NODE_ADDRS: http://node-p1:8001,http://node-p2:8001,http://node-p3:8001,http://node-p4:8001,http://node-p5:8001
    ports:
      - '9002:9002'
    depends_on:
      verifier-public:
        condition: service_healthy
      node-p1:
        condition: service_healthy
    networks:
      - saral-mesh
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:9002/health']
      interval: 4s
      timeout: 3s
      retries: 5

  coordinator-private:
    image: saral-coordinator:v3
