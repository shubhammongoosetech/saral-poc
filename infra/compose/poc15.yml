services:
  # ─── Auth Server ─────────────────────────────────────────────────────────
  auth-server:
    build:
      context: ../../apps/auth-server
      dockerfile: Dockerfile
    image: saral-auth-server:v3
    container_name: saral-auth-server
    restart: unless-stopped
    environment:
      PORT: 3001
      NODE_ENV: development
      ENABLE_DEV_AUTH: "true"
    ports:
      - '3001:3001'
    networks:
      - saral-mesh
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3001/health']
      interval: 4s
      timeout: 3s
      retries: 5

  # ─── Verifiers (Foundation, Public, Private) ───────────────────────────
  verifier-foundation:
    build:
      context: ../../services/verifier
      dockerfile: Dockerfile
    image: saral-verifier:v3
    container_name: saral-verifier-foundation
    restart: unless-stopped
    environment:
      PORT: 9101
      DOMAIN: FOUNDATION
      AUTH_SERVER_URL: http://auth-server:3001
    depends_on:
      auth-server:
        condition: service_healthy
    networks:
      - saral-mesh
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:9101/health']
      interval: 4s
      timeout: 3s
      retries: 5

  verifier-public:
    image: saral-verifier:v3
    container_name: saral-verifier-public
    restart: unless-stopped
    environment:
      PORT: 9102
      DOMAIN: PUBLIC
      AUTH_SERVER_URL: http://auth-server:3001
    depends_on:
      auth-server:
        condition: service_healthy
    networks:
      - saral-mesh
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:9102/health']
      interval: 4s
      timeout: 3s
      retries: 5

  verifier-private:
    image: saral-verifier:v3
    container_name: saral-verifier-private
    restart: unless-stopped
    environment:
      PORT: 9103
      DOMAIN: PRIVATE
      AUTH_SERVER_URL: http://auth-server:3001
    depends_on:
      auth-server:
        condition: service_healthy
    networks:
      - saral-mesh
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:9103/health']
      interval: 4s
      timeout: 3s
      retries: 5

  # ─── Foundation SARAL Nodes (1 - 5) ──────────────────────────────────
  node-f1:
    build:
      context: ../../services/saral-node
      dockerfile: Dockerfile
    image: saral-node:v3
    container_name: saral-node-f1
    restart: unless-stopped
    environment:
      NODE_ID: saral-foundation-1
      DOMAIN: FOUNDATION
      NODE_INDEX: 1
      PORT: 8001
      SARAL_INTERNAL_TOKEN: "saral-mesh-secure-internal-token-v3"
      SARAL_ENCRYPTION_KEY: "saral-mesh-aes-encryption-key-v3"
      COORDINATOR_URL: http://coordinator-foundation:9001
      PEER_NODES: http://node-f2:8001,http://node-p1:8001,http://node-r1:8001
    volumes: ['node_f1_vault:/vault']
    networks: [saral-mesh]
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:8001/node/status']
      interval: 4s
      timeout: 3s
      retries: 5

  node-f2:
    image: saral-node:v3
    container_name: saral-node-f2
    restart: unless-stopped
    environment:
      NODE_ID: saral-foundation-2
      DOMAIN: FOUNDATION
      NODE_INDEX: 2
      PORT: 8001
      SARAL_INTERNAL_TOKEN: "saral-mesh-secure-internal-token-v3"
      SARAL_ENCRYPTION_KEY: "saral-mesh-aes-encryption-key-v3"
      COORDINATOR_URL: http://coordinator-foundation:9001
