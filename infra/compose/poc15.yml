    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:8001/node/status']
      interval: 4s
      timeout: 3s
      retries: 5

  # ─── Public SARAL Nodes (1 - 5) ──────────────────────────────────────
