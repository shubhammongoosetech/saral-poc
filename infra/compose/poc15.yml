  node-r3:
    image: saral-node:v3
    container_name: saral-node-r3
    restart: unless-stopped
    environment:
      NODE_ID: saral-private-3
      DOMAIN: PRIVATE
      NODE_INDEX: 3
      PORT: 8001
      SARAL_INTERNAL_TOKEN: "saral-mesh-secure-internal-token-v3"
      SARAL_ENCRYPTION_KEY: "saral-mesh-aes-encryption-key-v3"
      COORDINATOR_URL: http://coordinator-private:9003
      PEER_NODES: http://node-r2:8001,http://node-r4:8001
    volumes: ['node_r3_vault:/vault']
