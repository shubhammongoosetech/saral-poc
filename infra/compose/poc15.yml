    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:8001/node/status']
      interval: 4s
      timeout: 3s
      retries: 5

  node-r4:
    image: saral-node:v3
    container_name: saral-node-r4
    restart: unless-stopped
    environment:
