      PORT: 9003
      SARAL_INTERNAL_TOKEN: "saral-mesh-secure-internal-token-v3"
      SARAL_ENCRYPTION_KEY: "saral-mesh-aes-encryption-key-v3"
      DOMAIN: PRIVATE
      VERIFIER_URL: http://verifier-private:9103
      PEER_COORDINATORS: http://coordinator-foundation:9001,http://coordinator-public:9002
      NODE_ADDRS: http://node-r1:8001,http://node-r2:8001,http://node-r3:8001,http://node-r4:8001,http://node-r5:8001
    ports:
      - '9003:9003'
    depends_on:
      verifier-private:
        condition: service_healthy
      node-r1:
        condition: service_healthy
    networks:
      - saral-mesh
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:9003/health']
      interval: 4s
      timeout: 3s
      retries: 5

  # ─── Web Frontend ──────────────────────────────────────────────────────
  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
    image: saral-web:v3
    container_name: saral-web
    restart: unless-stopped
    ports:
      - '3000:80'
    depends_on:
      auth-server:
        condition: service_healthy
      coordinator-foundation:
        condition: service_healthy
    networks:
      - saral-mesh
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:80']
      interval: 4s
      timeout: 3s
      retries: 5

networks:
  saral-mesh:
    driver: bridge

volumes:
  node_f1_vault:
  node_f2_vault:
  node_f3_vault:
  node_f4_vault:
  node_f5_vault:
  node_p1_vault:
  node_p2_vault:
  node_p3_vault:
  node_p4_vault:
  node_p5_vault:
  node_r1_vault:
  node_r2_vault:
  node_r3_vault:
  node_r4_vault:
  node_r5_vault:
