  # ─── Web Frontend ──────────────────────────────────────────────────────
  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
    image: saral-web:v3
    container_name: saral-web
    restart: unless-stopped
    ports:
      - '127.0.0.1:3000:80'
    depends_on:
      auth-server:
        condition: service_healthy
    networks:
      - saral-mesh
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:80']
      interval: 4s
      timeout: 3s
      retries: 5

networks:
  saral-mesh:
    driver: bridge

volumes:
  node_f1_vault:
  node_f2_vault:
  node_f3_vault:
  node_f4_vault:
  node_f5_vault:
  node_p1_vault:
  node_p2_vault:
  node_p3_vault:
  node_p4_vault:
  node_p5_vault:
  node_r1_vault:
  node_r2_vault:
  node_r3_vault:
  node_r4_vault:
  node_r5_vault:

secrets:
  saral_internal_token:
    file: ../../infra/secrets/internal_token.secret
  saral_admin_key:
    file: ../../infra/secrets/admin_key.secret
  saral_genesis_participants:
    file: ../../infra/config/genesis_participants.json
  auth_ed25519_pub:
    file: ../../infra/config/auth_public_key.pem
