# SARAL Cluster — Dynamically Generated Docker Compose Configuration
# Generated automatically from cluster topology specification in backend/.env
# Database: Configured for Local PostgreSQL on localhost:5432 (no duplicate postgres container)

services:
  saral-foundation-1:
    image: alpine:latest
    container_name: saral-foundation-1
    restart: unless-stopped
    command: ["tail", "-f", "/dev/null"]
    working_dir: /vault
    environment:
      - NODE_ID=saral-foundation-1
      - NODE_NAME=saral-foundation-1
      - DOMAIN=FOUNDATION
      - NODE_INDEX=1
      - PORT=4001
    volumes:
      - saral-foundation-1_data:/vault
    networks:
      - saral-net

